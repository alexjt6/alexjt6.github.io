# Workflow oficial de Astro para GitHub Pages:
# https://docs.astro.build/en/guides/deploy/github/
name: Deploy to GitHub Pages

on:
  # Despliega cada vez que se sube algo a main (p. ej. al mergear una PR)
  push:
    branches: [main]
  # Añadido al workflow oficial: en las PR solo se ejecuta el build,
  # para ver si compila antes de mergear. No se despliega nada.
  pull_request:
  # Permite lanzarlo a mano desde la pestaña Actions
  workflow_dispatch:

# Permisos mínimos que necesita el despliegue a GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # Instala dependencias, ejecuta `npm run build` y sube dist/ como artefacto
      - name: Build and upload site
        uses: withastro/action@v6

  deploy:
    # Añadido: no desplegar desde una pull request
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
